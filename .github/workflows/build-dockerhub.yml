name: 构建并推送镜像到GHCR
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build_push_image:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: LuvGaze
          password: ${{ github.token }}

      - name: 获取提交短哈希
        id: meta
        run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: 初始化Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建amd64镜像并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # 缓存配置：读取旧缓存 + 构建完成保存全部层缓存
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/luvgaze/libretv:latest
            ghcr.io/luvgaze/libretv:sha-${{ steps.meta.outputs.sha_short }}
